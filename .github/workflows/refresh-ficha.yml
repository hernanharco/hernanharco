name: Refresh profile ficha

on:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ficha
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh level/XP and quest dates
        env:
          # Public-only token: level comes from the anonymous calendar,
          # repos are read unauthenticated unless this secret exists.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/refresh_ficha.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README.md already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh ficha level and quest dates [skip ci]"
          git push
